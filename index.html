<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Management System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Student Management System</h1>
    <p class="subtitle">React-free CRUD demo &middot; HTML/CSS/JS + Django REST Framework + SQLite</p>
  </header>

  <main>
    <!-- Create / Update form -->
    <section class="card">
      <h2 id="form-title">Add Student</h2>
      <form id="student-form" novalidate>
        <input type="hidden" id="student-id" />

        <div class="field">
          <label for="name">Full Name</label>
          <input type="text" id="name" required maxlength="100" placeholder="e.g. Asha Rao" />
          <span class="error" id="err-name"></span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="e.g. asha@example.com" />
          <span class="error" id="err-email"></span>
        </div>

        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" required min="15" max="100" placeholder="15-100" />
          <span class="error" id="err-age"></span>
        </div>

        <div class="field">
          <label for="course">Course</label>
          <select id="course" required>
            <option value="">Select a course</option>
            <option value="CSE">Computer Science Engineering</option>
            <option value="ECE">Electronics &amp; Communication Engineering</option>
            <option value="MECH">Mechanical Engineering</option>
            <option value="CIVIL">Civil Engineering</option>
            <option value="IT">Information Technology</option>
            <option value="MBA">Master of Business Administration</option>
          </select>
          <span class="error" id="err-course"></span>
        </div>

        <div class="field">
          <label for="phone">Phone (optional)</label>
          <input type="text" id="phone" placeholder="e.g. +919876543210" />
          <span class="error" id="err-phone"></span>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn">Add Student</button>
          <button type="button" id="cancel-btn" class="secondary hidden">Cancel Edit</button>
        </div>
      </form>
    </section>

    <!-- List / Search -->
    <section class="card">
      <div class="list-header">
        <h2>Students</h2>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search by name, email or phone..." />
          <select id="course-filter">
            <option value="">All courses</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="MECH">MECH</option>
            <option value="CIVIL">CIVIL</option>
            <option value="IT">IT</option>
            <option value="MBA">MBA</option>
          </select>
        </div>
      </div>

      <div id="status-message" class="status hidden"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Age</th>
              <th>Course</th>
              <th>Phone</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="student-table-body">
            <!-- Rows injected by app.js -->
          </tbody>
        </table>
      </div>
      <p id="empty-message" class="empty hidden">No students found.</p>
    </section>
  </main>

  <footer>
    <p>API base: <code id="api-base-display"></code> &mdash; change it in <code>app.js</code> if your backend runs elsewhere.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
